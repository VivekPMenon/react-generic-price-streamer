name: Trigger auto deployment for hurricane-uat-web01

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ uat ]
    paths:
    - '**'
    - '.github/workflows/hurricane-uat-web01-AutoDeployTrigger-11970637-7f83-4fa3-825c-656304621d92.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2
        with:
          submodules: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.HURRICANEUATWEB01_AZURE_CREDENTIALS }}

      - name: Create .env file from secrets
        run: |
          cat <<EOF > ./TransientAI.UI/transientai-ui/.env
          NEXT_PUBLIC_ENV=${{ secrets.NEXT_PUBLIC_ENV_UAT }}
          NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_NEWS_API_URL=${{ secrets.NEXT_PUBLIC_NEWS_API_URL }}
          NEXT_PUBLIC_OPENAI_API_URL=${{ secrets.NEXT_PUBLIC_OPENAI_API_URL }}
          NEXT_PUBLIC_HURRICANE_API_URL=${{ secrets.NEXT_PUBLIC_HURRICANE_API_URL_UAT }}
          NEXT_PUBLIC_HURRICANE_API_2_0_URL=${{ secrets.NEXT_PUBLIC_HURRICANE_API_2_0_URL_UAT }}
          NEXT_PUBLIC_CORP_ACTIONS_API_URL=${{ secrets.NEXT_PUBLIC_CORP_ACTIONS_API_URL }}
          NEXT_PUBLIC_SELL_SIDE_API_URL=${{ secrets.NEXT_PUBLIC_SELL_SIDE_API_URL }}
          NEXT_PUBLIC_API_DEV_URL=${{ secrets.NEXT_PUBLIC_API_DEV_URL }}
          NEXT_PUBLIC_CORP_API_SUBSCRIPTION_KEY=${{ secrets.NEXT_PUBLIC_CORP_API_SUBSCRIPTION_KEY }}
          NEXT_PUBLIC_AUTH_CLIENT_ID=${{ secrets.NEXT_PUBLIC_AUTH_CLIENT_ID }}
          NEXT_PUBLIC_AUTH_TENANT_ID=${{ secrets.NEXT_PUBLIC_AUTH_TENANT_ID }}
          NEXT_PUBLIC_AUTH_SCOPE=${{ secrets.NEXT_PUBLIC_AUTH_SCOPE }}
          NEXT_PUBLIC_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_REDIRECT_URI_UAT }}
          EOF

          echo "✅ .env file created. Contents (redacted):"
          cat ./TransientAI.UI/transientai-ui/.env
        shell: bash

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/TransientAI.UI/transientai-ui
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: hurricaneuatacr01.azurecr.io
          registryUsername: ${{ secrets.HURRICANEUATWEB01_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.HURRICANEUATWEB01_REGISTRY_PASSWORD }}
          containerAppName: hurricane-uat-web01
          resourceGroup: Hurricane_uat
          imageToBuild: hurricaneuatacr01.azurecr.io/hurricane-uat-web01:${{ github.sha }}
          
            

     

